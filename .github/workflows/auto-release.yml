name: 自动同步官方新版并发布四环补丁版

# 逻辑：每天检查官方是否发布了比本 fork 最新版本更高的版本。
# 若有，则取官方源码 -> 打四环补丁（含把更新源指向本 fork）-> 编译 -> 打包 -> 发 release。
# 本机岛仔的更新源指向本 fork，因此用户点“更新”装到的永远是带补丁的版本。

on:
  schedule:
    - cron: '0 16 * * *'      # 每天 UTC 16:00（北京时间 00:00）检查一次
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

concurrency:
  group: quad-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Renly1994/xiaotang-daozai

jobs:
  sync-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出 fork 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Rust stable (MSVC)
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt

      - name: 获取官方最新版本与本 fork 最新版本
        id: ver
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'daoquad-bot'; 'Accept' = 'application/vnd.github+json' }
          $up = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$env:UPSTREAM_REPO/releases/latest"
          $upTag = $up.tag_name
          # 取本仓库已发布的最高版本 tag（若无则视为 0.0.0）
          $mine = ""
          try {
            $rel = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            $mine = ($rel | Where-Object { $_.tag_name -match '^v?\d+\.\d+\.\d+' } | ForEach-Object { $_.tag_name } | Sort-Object { [version]($_ -replace '^v','') } -Descending | Select-Object -First 1)
          } catch {}
          function V([string]$s){ if ($s -match '(\d+)\.(\d+)\.(\d+)'){ return [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])" } else { return [version]'0.0.0' } }
          $need = (V $upTag) -gt (V $mine)
          "upstream=$upTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "mine=$mine" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "need=$($need.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "官方=$upTag  本fork=$mine  需要发布=$need"

      - name: 跳过（无新版本）
        if: steps.ver.outputs.need != 'true'
        shell: pwsh
        run: Write-Host "已是最新，无需发布。"

      - name: 下载官方源码
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.upstream }}"
          Invoke-WebRequest -Uri "https://github.com/$env:UPSTREAM_REPO/archive/refs/tags/$tag.tar.gz" -OutFile upstream.tar.gz
          tar -xzf upstream.tar.gz
          # 解压目录名形如 xiaotang-daozai-0.6.66；用版本数字精确匹配，避免匹配到工作目录本身。
          # 重命名为 upstream-src，避免与 fork 仓库自带的 src/ 目录冲突。
          $dir = Get-ChildItem -Directory | Where-Object { $_.Name -match '^xiaotang-daozai-[0-9]' } | Select-Object -First 1
          if (-not $dir) { throw '找不到解压后的官方源码目录' }
          Move-Item $dir.FullName upstream-src
          Write-Host "源码目录: upstream-src"

      - name: 打四环补丁（含改更新源指向本 fork）
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        env:
          DAOZAI_FORK_REPO: ${{ github.repository }}
          PYTHONIOENCODING: utf-8
        run: |
          python .daozai-patch/apply_patch.py upstream-src .daozai-patch
          if ($LASTEXITCODE -ne 0) { throw '补丁失败' }

      - name: 安装 NSIS
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        run: |
          $nsis = ./upstream-src/scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          "NSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 补齐中文诊断脚本（tar 解压可能丢失中文文件名）
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        run: |
          # 从 fork 检出目录（英文路径、编码正常）复制诊断 cmd 到待打包源码，
          # 用通配符匹配，避免在脚本里写中文字面量导致编码问题。
          $src = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'installer') -Filter '*.cmd' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $src) { throw 'fork 检出目录里找不到诊断 cmd' }
          $dest = Join-Path $env:GITHUB_WORKSPACE 'upstream-src\installer'
          if (-not (Test-Path -LiteralPath $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
          Copy-Item -LiteralPath $src.FullName -Destination $dest -Force
          Write-Host "已复制: $($src.Name) -> upstream-src\installer"

      - name: 编译并打包
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        working-directory: upstream-src
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          ./scripts/package.ps1 -NsisCompiler $env:NSIS -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist')

      - name: 发布带补丁的 release
        if: steps.ver.outputs.need == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.upstream }}"
          $zip = Get-ChildItem dist -Filter 'Daozai-v*.zip' | Select-Object -First 1
          $setup = Get-ChildItem dist -Filter 'Daozai-Setup-*.exe' | Select-Object -First 1
          $notes = @"
          基于官方 $tag 源码，自动套用四环余额面板补丁。

          - 原生「AI 额度」页显示 WorkBuddy / TRAE / Qoder / MobileClaw 四环剩余积分
          - 更新源已指向本 fork，应用内更新会持续保持补丁
          - 补丁由 GitHub Actions 自动生成，官方发新版后约数分钟发布

          免安装：下载 zip 解压；或直接覆盖安装目录里的 daozai.exe。
          "@
          $assets = @($zip.FullName)
          if ($setup) { $assets += $setup.FullName }
          gh release create $tag --title "岛仔 $tag · 四环补丁版" --notes $notes $assets
          Write-Host "已发布 release $tag"
